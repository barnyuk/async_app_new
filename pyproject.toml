[project]
name = "async-protocol-app"
version = "0.1.0"
description = "async protocol app"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "pydantic (>=2.14.4,<3.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "typing-extensions (>=4.16.0,<5.0.0)"
]

# Выносим инструменты разработки в отдельную группу
[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.6,<0.18.0"
mypy = ">=2.4.1,<3.0.0"
bandit = ">=1.9.4,<2.0.0"
radon = ">=6.0.1,<7.0.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app"]
extend-exclude = [".venv", "venv", "build", "dist", "__pycache__", "migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true